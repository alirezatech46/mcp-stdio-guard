[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stdio-guard"
version = "0.1.0"
description = "Zero-dependency JSON-RPC 2.0 stdio security interceptor and Shannon-entropy secret firewall for MCP servers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "security", "json-rpc", "firewall", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
py-modules = ["mcp_guard"]
