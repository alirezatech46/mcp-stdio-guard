[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stdio-guard"
version = "0.2.0"
description = "Zero-dependency JSON-RPC 2.0 stdio security interceptor and secret firewall for Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "security", "json-rpc", "firewall", "stdio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
mcp-stdio-guard = "cli:main"

[tool.setuptools]
py-modules = ["mcp_guard", "cli"]
